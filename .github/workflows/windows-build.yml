name: Windows Build and Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows x64 / .NET 10
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify FFmpeg tools (needed by Python integration tests)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe unavailable' }

      - name: Static project checks
        run: python scripts/check_source.py

      - name: Python / FFmpeg integration tests
        run: python -m unittest discover -s tests/python -v

      - name: Restore .NET dependencies
        run: dotnet restore AIPrivacyGuard.slnx

      - name: Compile solution
        run: dotnet build AIPrivacyGuard.slnx -c Release --no-restore

      - name: Run .NET unit tests
        run: dotnet test tests/PrivacyGuard.Core.Tests/PrivacyGuard.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Run live OBS bridge integration tests
        run: dotnet test tests/PrivacyGuard.LiveObs.Tests/PrivacyGuard.LiveObs.Tests.csproj -c Release --no-build --no-restore

      - name: Optional third-party NudeNet real ONNX inference smoke
        id: nudenet_smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke-nudenet.ps1

      - name: Report NudeNet smoke result
        if: always()
        shell: pwsh
        run: |
          $status = '${{ steps.nudenet_smoke.outcome }}'
          "NudeNet external ONNX smoke: $status" >> $env:GITHUB_STEP_SUMMARY
          if ($status -ne 'success') {
            "Upstream model download/inference NOT verified. This does not certify exposure detection." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Run real NudeNet visual fixture evaluation
        id: nudenet_visual
        continue-on-error: true
        shell: pwsh
        run: ./scripts/run-nudenet-visual-eval.ps1

      - name: Publish visual fixture evaluation archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R6-NudeNet-Visual-Test-Data-And-Results
          path: |
            dist/nudenet-visual-eval/inputs/*.png
            dist/nudenet-visual-eval/fixtures.json
            dist/nudenet-visual-eval/report/*
          if-no-files-found: warn
          retention-days: 14

      - name: Record visual fixture evaluation result
        if: always()
        shell: pwsh
        run: |
          $outcome = '${{ steps.nudenet_visual.outcome }}'
          "NudeNet model visual fixture result: $outcome" >> $env:GITHUB_STEP_SUMMARY
          if ($outcome -ne 'success') {
            "Visual sample inference NOT VERIFIED; examine the step logs before using its archive." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Run adult fashion, 2D anime and Genshin 3D external-media inference
        id: realmedia_eval
        continue-on-error: true
        shell: pwsh
        run: ./scripts/run-nudenet-public-media-eval.ps1

      - name: Upload external-media metadata and source-free geometry diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R6-Adult-Fashion-Anime-Genshin-Model-Results
          path: |
            dist/nudenet-public-media-eval/fixtures.json
            dist/nudenet-public-media-eval/maps_index.json
            dist/nudenet-public-media-eval/geometry_maps/*
            dist/nudenet-public-media-eval/report/results.json
            dist/nudenet-public-media-eval/report/README.md
          if-no-files-found: warn
          retention-days: 14

      - name: Report cross-domain AI evaluation outcome
        if: always()
        shell: pwsh
        run: |
          $status = '${{ steps.realmedia_eval.outcome }}'
          "External adult media/2D/Genshin eval: $status" >> $env:GITHUB_STEP_SUMMARY
          if ($status -ne 'success') {
            "External image evaluation NOT VERIFIED; inspect logs and sources." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish Windows x64 app
        run: dotnet publish src/PrivacyGuard.App/PrivacyGuard.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/win-x64

      - name: Publish R5.1 experimental OBS bridge
        run: dotnet publish src/PrivacyGuard.LiveBridge/PrivacyGuard.LiveBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/live-bridge

      - name: Bundle experimental LiveBridge alongside WPF app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist/win-x64/live-bridge' -Force | Out-Null
          Copy-Item -Path 'dist/live-bridge/*' -Destination 'dist/win-x64/live-bridge/' -Recurse -Force

      - name: Validate published executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/win-x64/AIPrivacyGuard.exe')) {
            throw 'Expected AIPrivacyGuard.exe was not produced'
          }
          if (-not (Test-Path 'dist/live-bridge/AIPrivacyGuard.LiveBridge.exe')) {
            throw 'Expected R5.2 live bridge EXE was not produced'
          }
          if (-not (Test-Path 'dist/win-x64/live-bridge/AIPrivacyGuard.LiveBridge.exe')) {
            throw 'Expected bundled R5.2 WPF live bridge was not produced'
          }
          Write-Host 'EXEs exist; WPF/OBS desktop runtime and detection accuracy have NOT been verified.'

      - name: Upload app build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPrivacyGuard-R6-Windows-x64
          path: dist/win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental OBS bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPrivacyGuard-R6-LiveBridge-Windows-x64
          path: dist/live-bridge/
          if-no-files-found: error
          retention-days: 14
