name: Windows Build and Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows x64 / .NET 10
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify FFmpeg tools (needed by Python integration tests)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe unavailable' }

      - name: Static project checks
        run: python scripts/check_source.py

      - name: Python / FFmpeg integration tests
        run: python -m unittest discover -s tests/python -v

      - name: Restore .NET dependencies
        run: dotnet restore AIPrivacyGuard.slnx

      - name: Compile solution
        run: dotnet build AIPrivacyGuard.slnx -c Release --no-restore

      - name: Run .NET unit tests
        run: dotnet test tests/PrivacyGuard.Core.Tests/PrivacyGuard.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Run live OBS bridge integration tests
        run: dotnet test tests/PrivacyGuard.LiveObs.Tests/PrivacyGuard.LiveObs.Tests.csproj -c Release --no-build --no-restore

      - name: Publish Windows x64 app
        run: dotnet publish src/PrivacyGuard.App/PrivacyGuard.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/win-x64

      - name: Publish R5.1 experimental OBS bridge
        run: dotnet publish src/PrivacyGuard.LiveBridge/PrivacyGuard.LiveBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/live-bridge

      - name: Validate published executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/win-x64/AIPrivacyGuard.exe')) {
            throw 'Expected AIPrivacyGuard.exe was not produced'
          }
          if (-not (Test-Path 'dist/live-bridge/AIPrivacyGuard.LiveBridge.exe')) {
            throw 'Expected R5.1 live bridge EXE was not produced'
          }
          Write-Host 'EXEs exist; WPF/OBS desktop runtime and detection accuracy have NOT been verified.'

      - name: Upload app build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPrivacyGuard-R5.1-Windows-x64
          path: dist/win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental OBS bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPrivacyGuard-R5.1-LiveBridge-Windows-x64
          path: dist/live-bridge/
          if-no-files-found: error
          retention-days: 14
